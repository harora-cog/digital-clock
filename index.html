<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Timezone Digital Clock</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>World Clock</h1>
        <p class="subtitle">Current time across different time zones</p>
        
        <div class="controls">
            <input type="text" id="timezoneInput" placeholder="Add timezone (e.g., America/New_York)">
            <button onclick="addTimezone()">Add Timezone</button>
            <button onclick="resetToDefault()">Reset to Default</button>
        </div>
        
        <div class="clock-grid" id="clockGrid">
            <!-- Clocks will be dynamically inserted here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
